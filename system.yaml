# yaml-language-server: $schema=./system.schema.json
student: amolins.ieu2024
prefix: amolins-ieu2024
public_url: https://amolinsieu2024ui.z1.web.core.windows.net
ui:
  path: ui
  storage_account: amolinsieu2024ui
  calls: [pipeline, skills]
azure:
  resource_group: rg-amolins
  container_apps_environment: amolins-ieu2024-env
  sql_server: amolins-ieu2024-sql
  registry: ghcr.io/alemol123
services:
  pipeline:
    description: Job applications, their stages and stage history.
    path: services/pipeline
    openapi: services/pipeline/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/pipeline/migrations
    env:
      PORT: { default: 8000, description: Port the service listens on }
      DATABASE_URL: { secret: true, description: Connection string of the pipeline database }
      ALLOWED_ORIGIN: { default: "http://localhost:8080", description: The only origin allowed by CORS (the UI) }
      STALE_DAYS: { default: 14, description: Days without a stage change before an active application counts as stale }
      GIT_SHA: { default: unknown, description: Commit SHA reported by /health }
    calls: []
    azure:
      container_app: amolins-ieu2024-pipeline
      sql_database: amolins-ieu2024-pipeline-db
  skills:
    description: Skills, my proficiency in each, the skills each application requires, and the skill gap.
    path: services/skills
    openapi: services/skills/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/skills/migrations
    env:
      PORT: { default: 8000, description: Port the service listens on }
      DATABASE_URL: { secret: true, description: Connection string of the skills database }
      ALLOWED_ORIGIN: { default: "http://localhost:8080", description: The only origin allowed by CORS (the UI) }
      PIPELINE_URL: { default: "http://pipeline:8000", description: Base URL of the pipeline service }
      PIPELINE_TIMEOUT_S: { default: 2, description: Timeout in seconds for calls to pipeline (CD sets 10 on Azure for cold starts) }
      GIT_SHA: { default: unknown, description: Commit SHA reported by /health }
    calls:
      - service: pipeline
        url_env: PIPELINE_URL
        endpoints: ["GET /applications/active-ids", "GET /applications/{id}"]
        timeout_s: 2
        on_failure: >-
          The gap page shows a "pipeline unavailable" notice with no ranking while the skills
          list keeps working; tagging a skill on an application fails closed with 503.
    azure:
      container_app: amolins-ieu2024-skills
      sql_database: amolins-ieu2024-skills-db
