<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Search Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1><a href="{{ url_for('pipeline.list_view') }}">Job Search Tracker</a></h1>
    <nav>
      <a href="{{ url_for('pipeline.list_view') }}">Applications</a>
      <a href="{{ url_for('pipeline.new') }}">New application</a>
      <a href="{{ url_for('skills.list_view') }}">Skills</a>
      <a href="{{ url_for('skills.gap') }}">Skill gap</a>
    </nav>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="flash {{ category }}">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
