name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [pipeline, skills]
    # A throwaway SQL Server next to the job: tests never touch Azure SQL.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Ci_Only_Passw0rd!" }   # CI-only container, not a secret
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Only_Passw0rd!' -C -Q 'SELECT 1'"
          --health-interval 10s --health-retries 20 --health-start-period 20s
    env:
      # conftest.py creates this database if missing and runs the migrations on it.
      TEST_DATABASE_URL: mssql://sa:Ci_Only_Passw0rd!@localhost:1433/${{ matrix.service }}_test
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=${{ matrix.service }} --cov-report=term-missing --cov-fail-under=70

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openapi-spec-validator==0.7.1 check-jsonschema==0.29.4
      - run: openapi-spec-validator services/pipeline/openapi.yaml services/skills/openapi.yaml
      - run: check-jsonschema --schemafile system.schema.json system.yaml

  images:
    needs: [test, validate]           # no image from a commit that failed lint/tests/validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                 # lets GITHUB_TOKEN push to ghcr.io
    strategy:
      matrix:
        service: [pipeline, skills]
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase; ${VAR,,} lowercases the owner name.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}   # every push/PR builds, only main publishes
          tags: ghcr.io/${{ env.OWNER }}/jst-${{ matrix.service }}:${{ github.sha }}
