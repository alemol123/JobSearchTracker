<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Search Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('pipeline.list_view') }}">Job Search Tracker</a>
      <nav>
        {# request.blueprint is "pipeline" or "skills": highlight the section we're in #}
        <a href="{{ url_for('pipeline.list_view') }}"
           class="{{ 'active' if request.blueprint == 'pipeline' or request.endpoint == 'skills.application_skills' else '' }}">Applications</a>
        <a href="{{ url_for('skills.list_view') }}"
           class="{{ 'active' if request.endpoint == 'skills.list_view' else '' }}">Skills</a>
        <a href="{{ url_for('skills.gap') }}"
           class="{{ 'active' if request.endpoint == 'skills.gap' else '' }}">Skill gap</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="alert {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
